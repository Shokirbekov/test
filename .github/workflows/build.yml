name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip PocoGlass.zip
      - run: echo "android.suppressUnsupportedCompileSdk=36" >> PocoGlass/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: cd PocoGlass && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PocoGlass-debug
          path: PocoGlass/app/build/outputs/apk/debug/*.apk
